<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Panel | TikTok Printer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Mono:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/reset.css?v=1.0">
    <link rel="stylesheet" href="assets/css/style.css?v=1.1">
    <style>
        .admin-view {
            overflow-y: auto !important;
            padding: 2rem 1rem;
        }

        .admin-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            margin: auto;
            position: relative;
            z-index: 10;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 0.8rem;
            padding: 0.8rem 1rem;
            color: white;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .section-title {
            color: var(--neon-blue);
            font-size: 1rem;
            margin: 2rem 0 1rem 0;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.5rem;
        }

        .save-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 1rem;
            border-radius: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .save-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .back-link {
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 2rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: white;
        }

        .success-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 1rem 2rem;
            border-radius: 2rem;
            display: none;
            z-index: 100;
        }
    </style>
</head>

<body class="landing-page admin-view">
    <div class="main">
        <div class="container landing-container" style="height: auto; min-height: 100vh;">
            <div class="overlay"></div>

            <div class="admin-card">
                <a href="index.html" class="back-link">← Volver al Inicio</a>

                <h1 style="color: white; font-size: 1.5rem; margin-bottom: 0.5rem;">Configuración <span>ADMIN</span>
                </h1>
                <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 2rem;">Personaliza tu experiencia
                    Live</p>

                <form id="adminForm">
                    <div class="section-title">Usuario de TikTok</div>
                    <div class="form-group">
                        <label>Tu @ID (Sync Automática)</label>
                        <input type="text" id="tiktokId" placeholder="ej: tu_usuario">
                    </div>
                    <!-- Sección de cambio de clave eliminada por seguridad -->
                    <div class="form-group">
                        <label>Session ID (Opcional - Estabilidad)</label>
                        <input type="text" id="sessionId" placeholder="Pega tu Session ID aquí">
                        <small
                            style="color: var(--text-muted); font-size: 0.7rem; margin-top: 5px; display: block;">Recomendado
                            para evitar desconexiones.</small>
                    </div>

                    <div class="section-title">Eventos Activos</div>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" id="confComment"> Comentarios
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="confLike"> Likes
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="confShare"> Shares
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="confJoin"> Entrada User
                        </label>
                    </div>

                    <!-- Seguridad eliminada -->

                    <button type="submit" class="save-btn">Guardar Cambios</button>
                    <button type="button" id="logoutBtn" class="save-btn"
                        style="background: var(--danger); margin-top: 1rem;">Cerrar Sesión</button>
                </form>
            </div>
        </div>
    </div>

    <div id="toast" class="success-toast">¡Configuración Guardada! 🚀</div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/admin.js"></script>
</body>

</html>
