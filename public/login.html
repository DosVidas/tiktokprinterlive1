<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | TikTok Printer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Mono:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/reset.css?v=1.0">
    <link rel="stylesheet" href="assets/css/style.css?v=1.1">
    <style>
        .login-view {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
            padding: 3rem 2rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        .login-logo {
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 0.5rem;
            line-height: 1;
        }

        .login-logo span {
            color: var(--neon-blue);
        }

        .login-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .login-form .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .login-form input[type="password"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            padding: 1.2rem;
            color: white;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 10px;
            transition: all 0.3s;
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        .login-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 1.2rem;
            border-radius: 1rem;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 1rem;
        }

        .login-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>

<body class="login-view">
    <div class="main">
        <div class="overlay"></div>
        <div class="login-card">
            <h1 class="login-logo">TIKTOK<br><span>PRINTER</span></h1>
            <p class="login-subtitle">Acceso Reservado</p>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <input type="password" id="accessCode" placeholder="••••••" required autofocus>
                </div>
                <button type="submit" class="login-btn">Entrar al Sistema</button>
                <p id="errorMsg" class="error-msg">Código incorrecto. Inténtalo de nuevo.</p>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- We will use a separate auth.js for logic -->
    <script src="assets/js/auth.js"></script>
    <script>
        $(document).ready(() => {
            $('#loginForm').submit((e) => {
                e.preventDefault();
                const code = $('#accessCode').val();

                if (Auth.login(code)) {
                    window.location.href = 'menu.html';
                } else {
                    $('#errorMsg').fadeIn();
                    $('#accessCode').val('').focus();
                }
            });
        });
    </script>
</body>

</html>
